<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nitro Forge - Drag Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
/* ===== NITRO FORGE - STYLE.CSS ===== */

:root {
  --bg0: #05050d;
  --bg1: #0c0c1a;
  --bg2: #13132a;
  --bg3: #1a1a38;
  --accent: #39ff14;
  --accent2: #ffcc00;
  --accent3: #ff4400;
  --blue: #00aaff;
  --purple: #cc44ff;
  --text: #dde0ff;
  --text-dim: #778;
  --border: #2a2a50;
  --green: #39ff14;
  --red: #ff1144;
  --yellow: #ffcc00;
  --nos-color: #00eeff;
  --shadow-glow: 0 0 12px rgba(57,255,20,0.4);
  --font-mono: 'Share Tech Mono', monospace;
  --font-title: 'Orbitron', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

body {
  font-family: var(--font-mono);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CONTAINER ── */
#game-container {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  max-height: 860px;
  overflow: hidden;
  background: var(--bg0);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

/* ── TOP HUD ── */
#top-hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: linear-gradient(to bottom, rgba(5,5,13,0.95), rgba(5,5,13,0.7));
  border-bottom: 1px solid var(--border);
  pointer-events: none;
}
.hud-cell { font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
.hud-cell #hud-money, .hud-cell #hud-level { color: var(--accent2); font-weight: bold; }
.hud-icon { margin-right: 3px; }
.logo-small {
  font-family: var(--font-title);
  font-size: 12px;
  font-weight: 900;
  color: var(--text-dim);
  letter-spacing: 2px;
}
.logo-small span { color: var(--accent); }

/* ── SCREENS ── */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding-top: 40px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.screen.active { display: flex; }

/* ── SCREEN HEADERS ── */
.screen-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg1);
  flex-shrink: 0;
}
.screen-header h2 {
  flex: 1;
  text-align: center;
  font-family: var(--font-title);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--accent);
}

/* ── BUTTONS ── */
.btn {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  padding: 10px 18px;
  cursor: pointer;
  transition: all 0.12s ease;
  text-transform: uppercase;
  outline: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { border-color: var(--accent2); color: var(--accent2); }
.btn-primary:hover { background: rgba(255,204,0,0.12); box-shadow: 0 0 8px rgba(255,204,0,0.3); }
.btn-green  { border-color: var(--green); color: var(--green); }
.btn-green:hover  { background: rgba(57,255,20,0.1); box-shadow: var(--shadow-glow); }
.btn-secondary { border-color: var(--blue); color: var(--blue); }
.btn-secondary:hover { background: rgba(0,170,255,0.1); }
.btn-dim { border-color: var(--border); color: var(--text-dim); }
.btn-back { padding: 6px 10px; font-size: 11px; border-color: var(--border); color: var(--text-dim); }
.btn-xs { padding: 4px 8px; font-size: 10px; }
.btn-launch {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-family: var(--font-title);
  font-weight: 900;
  letter-spacing: 4px;
  border-color: var(--green);
  color: var(--green);
  background: rgba(57,255,20,0.05);
  animation: pulse-green 1.5s infinite;
}
.btn-launch.armed {
  border-color: var(--yellow);
  color: var(--yellow);
  background: rgba(255,204,0,0.08);
  animation: none;
}
.btn-launch.shift-mode {
  border-color: var(--accent3);
  color: var(--accent3);
  background: rgba(255,68,0,0.08);
  animation: pulse-orange 0.6s infinite;
}
.btn-nos {
  padding: 8px 14px;
  border-color: var(--nos-color);
  color: var(--nos-color);
  font-size: 13px;
  font-weight: bold;
}
.btn-nos:disabled { opacity: 0.3; pointer-events: none; }

@keyframes pulse-green {
  0%,100% { box-shadow: 0 0 6px rgba(57,255,20,0.2); }
  50%      { box-shadow: 0 0 18px rgba(57,255,20,0.5); }
}
@keyframes pulse-orange {
  0%,100% { box-shadow: 0 0 6px rgba(255,68,0,0.3); }
  50%      { box-shadow: 0 0 18px rgba(255,68,0,0.7); }
}

/* ── TITLE SCREEN ── */
#screen-title { align-items: center; justify-content: center; gap: 16px; }
.title-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.3;
  pointer-events: none;
}
.title-content { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; padding: 0 20px; }
.title-logo-wrap { text-align: center; }
.title-logo {
  font-family: var(--font-title);
  font-size: 48px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: 4px;
  text-shadow: 0 0 30px rgba(57,255,20,0.5);
}
.title-logo span { color: var(--accent); }
.title-sub {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-dim);
  margin-top: 4px;
}
#title-car-canvas { image-rendering: pixelated; max-width: 100%; }
.title-menu { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
.title-menu .btn { text-align: center; }
.title-bottom { display: flex; gap: 16px; font-size: 10px; color: var(--text-dim); }

/* ── GARAGE ── */
.garage-showcase {
  background: var(--bg1);
  padding: 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#garage-canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
.car-stat-bar { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
.stat-row { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--text-dim); }
.stat-row > span:first-child { width: 20px; }
.stat-row > span:last-child { width: 50px; text-align: right; color: var(--text); font-size: 10px; }
.stat-bar-wrap { flex: 1; height: 6px; background: var(--bg3); border: 1px solid var(--border); }
.stat-fill { height: 100%; transition: width 0.3s ease; }
.stat-fill.hp  { background: var(--accent3); }
.stat-fill.wt  { background: var(--blue); }
.stat-fill.gr  { background: var(--green); }
.stat-fill.pr  { background: var(--purple); }
.car-nav { display: flex; align-items: center; gap: 6px; font-size: 11px; }

/* ── TABS ── */
.garage-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab-btn {
  flex: 1;
  padding: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  border: none;
  background: var(--bg1);
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.1s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg2); }

/* ── GARAGE TAB CONTENT ── */
#garage-tab-content { flex: 1; overflow-y: auto; padding: 10px; }
.mod-category { margin-bottom: 16px; }
.mod-category-title {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--accent2);
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}
.mod-options { display: flex; flex-direction: column; gap: 4px; }
.mod-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: var(--bg1);
  cursor: pointer;
  transition: all 0.1s;
  font-size: 11px;
}
.mod-option:hover { border-color: var(--accent2); background: var(--bg2); }
.mod-option.active { border-color: var(--green); background: rgba(57,255,20,0.06); }
.mod-option.active::before { content: '▶ '; color: var(--green); }
.mod-option.locked { opacity: 0.4; cursor: not-allowed; }
.mod-name { flex: 1; }
.mod-hp { color: var(--accent3); font-size: 10px; width: 50px; text-align: center; }
.mod-price { color: var(--accent2); font-size: 10px; width: 60px; text-align: right; }
.mod-price.owned { color: var(--green); }

/* ── PAINT OPTIONS ── */
.paint-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 8px 0; }
.paint-swatch {
  width: 40px; height: 40px;
  border: 2px solid var(--border);
  cursor: pointer;
  border-radius: 2px;
}
.paint-swatch.active { border-color: white; box-shadow: 0 0 8px rgba(255,255,255,0.5); }

/* ── TUNE OPTIONS ── */
.tune-section { padding: 8px 0; }
.tune-item { display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); background: var(--bg1); }
.tune-label { font-size: 10px; color: var(--text-dim); width: 120px; }
.tune-slider { flex: 1; accent-color: var(--accent); }
.tune-value { font-size: 11px; width: 40px; text-align: right; color: var(--text); }

/* ── SHOP ── */
.shop-filters { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg1); flex-shrink: 0; }
.filter-btn {
  flex: 1;
  padding: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text-dim);
  cursor: pointer;
}
.filter-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(255,204,0,0.08); }
#shop-balance { margin-left: auto; font-size: 11px; color: var(--accent2); }
#car-list { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.car-card {
  border: 1px solid var(--border);
  background: var(--bg1);
  padding: 12px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.car-card.owned { border-color: var(--green); }
.car-card.active-car { border-color: var(--accent2); background: rgba(255,204,0,0.05); }
.car-card-canvas { flex-shrink: 0; image-rendering: pixelated; }
.car-card-info { flex: 1; min-width: 0; }
.car-card-name { font-family: var(--font-title); font-size: 12px; color: var(--text); margin-bottom: 2px; }
.car-card-class { font-size: 10px; color: var(--text-dim); }
.car-card-stats { display: flex; gap: 8px; margin-top: 4px; font-size: 10px; color: var(--text-dim); }
.car-card-stats span { color: var(--text); }
.car-card-action { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.car-card-price { font-size: 12px; color: var(--accent2); }
.car-card-price.free { color: var(--green); }

/* ── RACE MENU ── */
#race-menu-car-preview {
  padding: 10px 12px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
#race-mode-list { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.race-mode-section { border: 1px solid var(--border); background: var(--bg1); }
.race-mode-header {
  padding: 10px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--accent2);
  letter-spacing: 2px;
}
.race-mode-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.race-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.1s;
  font-size: 11px;
}
.race-entry:hover { border-color: var(--green); background: rgba(57,255,20,0.05); }
.race-entry-name { flex: 1; }
.race-entry-opp { color: var(--text-dim); font-size: 10px; width: 80px; text-align: center; }
.race-entry-reward { color: var(--accent2); font-size: 11px; width: 70px; text-align: right; }

/* ── RACE SCREEN ── */
#screen-race { padding-top: 0; position: relative; }
#race-canvas { display: block; width: 100%; flex: 1; }

/* CHRISTMAS TREE */
#xmas-tree {
  position: absolute;
  top: 44px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 50;
  background: rgba(5,5,13,0.8);
  padding: 6px 8px;
  border: 1px solid var(--border);
}
.tree-col { display: flex; flex-direction: column; gap: 4px; }
.tree-light {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.8);
  transition: background 0.1s, box-shadow 0.1s;
}
.tree-light.yellow.on  { background: #ffcc00; box-shadow: 0 0 10px #ffcc00, 0 0 20px #ffaa00; }
.tree-light.green.on   { background: #39ff14; box-shadow: 0 0 12px #39ff14, 0 0 24px #22cc00; }
.tree-light.red-on     { background: #ff1144; box-shadow: 0 0 12px #ff1144; }

/* RACE HUD */
#race-hud {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  flex-direction: column;
  z-index: 30;
  background: linear-gradient(to top, rgba(5,5,13,0.97) 70%, transparent);
}
#race-top-bar {
  display: flex;
  justify-content: space-between;
  padding: 6px 12px;
}
.rinfo-block { text-align: center; }
.rinfo-label { font-size: 8px; letter-spacing: 2px; color: var(--text-dim); }
.rinfo-val { font-family: var(--font-title); font-size: 14px; color: var(--text); }
.center-block {
  font-family: var(--font-title);
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--accent);
  align-self: center;
}

#race-bottom-bar {
  display: flex;
  align-items: center;
  padding: 6px 10px;
  gap: 8px;
  border-top: 1px solid var(--border);
}
#rpm-wrap { flex: 1; position: relative; }
#rpm-gauge { display: block; image-rendering: pixelated; }
.shift-msg {
  position: absolute;
  top: -18px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  font-family: var(--font-title);
  letter-spacing: 2px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
}
.shift-msg.show { opacity: 1; }
.shift-msg.perfect { color: #ff44ff; text-shadow: 0 0 8px #ff44ff; }
.shift-msg.good    { color: var(--green); }
.shift-msg.early   { color: var(--blue); }
.shift-msg.late    { color: var(--red); }

#race-center { text-align: center; width: 60px; }
#r-speed { font-family: var(--font-title); font-size: 22px; color: var(--text); line-height: 1; }
.speed-unit { font-size: 8px; letter-spacing: 2px; color: var(--text-dim); }
#r-gear { font-family: var(--font-title); font-size: 18px; color: var(--accent2); margin-top: 2px; }

#nos-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 44px; }
.nos-label { font-size: 8px; letter-spacing: 1px; color: var(--nos-color); }
#nos-bar-bg { width: 8px; height: 50px; background: var(--bg3); border: 1px solid var(--border); }
#nos-bar-fill { width: 100%; background: var(--nos-color); transition: height 0.1s; height: 0%; }

#race-action-row { padding: 6px 10px 10px; }

.perfect-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 40;
}
.perfect-flash.show { animation: flashAnim 0.25s ease-out forwards; }
@keyframes flashAnim {
  0%   { background: rgba(255,68,255,0.35); }
  100% { background: rgba(255,68,255,0); }
}

/* ── RESULTS ── */
#screen-results { align-items: center; justify-content: center; }
#results-inner { padding: 20px; width: 100%; max-width: 400px; }
#results-banner {
  font-family: var(--font-title);
  font-size: 36px;
  font-weight: 900;
  text-align: center;
  letter-spacing: 6px;
  margin-bottom: 12px;
}
#results-banner.win  { color: var(--green); text-shadow: 0 0 30px var(--green); }
#results-banner.lose { color: var(--red); text-shadow: 0 0 30px var(--red); }
#results-banner.draw { color: var(--yellow); }
#results-winner-text { text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; letter-spacing: 1px; }
#results-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.res-stat { background: var(--bg1); border: 1px solid var(--border); padding: 8px; text-align: center; }
.res-stat-label { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; }
.res-stat-value { font-family: var(--font-title); font-size: 16px; color: var(--text); margin-top: 2px; }
.res-stat-value.good { color: var(--green); }
.res-stat-value.highlight { color: var(--accent2); }
#results-rewards-box {
  background: var(--bg1);
  border: 1px solid var(--accent2);
  padding: 10px;
  text-align: center;
  margin-bottom: 16px;
}
.reward-line { font-size: 12px; color: var(--accent2); margin: 2px 0; }
.results-btns { display: flex; flex-direction: column; gap: 8px; }

/* ── RECORDS ── */
#records-content { padding: 10px; overflow-y: auto; flex: 1; }
.record-section { margin-bottom: 16px; }
.record-section-title { font-size: 10px; letter-spacing: 2px; color: var(--accent2); padding: 4px 0; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.record-row { display: flex; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid rgba(42,42,80,0.5); font-size: 11px; }
.record-row:nth-child(odd) { background: var(--bg1); }
.record-car-name { color: var(--text); }
.record-et { color: var(--green); font-family: var(--font-title); }
.record-speed { color: var(--blue); }

/* ── MODAL ── */
#modal-overlay {
  position: absolute;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
}
#modal-overlay.hidden { display: none; }
#modal-box {
  width: 90%;
  max-width: 340px;
  background: var(--bg2);
  border: 1px solid var(--accent);
  padding: 20px;
  box-shadow: 0 0 40px rgba(57,255,20,0.2);
}
#modal-body { margin-bottom: 14px; font-size: 12px; line-height: 1.7; }

/* ── TOAST ── */
#toast-container {
  position: absolute;
  top: 50px;
  right: 8px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: none;
}
.toast {
  background: var(--bg3);
  border-left: 3px solid var(--accent);
  padding: 8px 12px;
  font-size: 11px;
  max-width: 220px;
  animation: toastIn 0.2s ease, toastOut 0.3s ease 2s forwards;
}
.toast.warn { border-color: var(--accent3); }
.toast.info { border-color: var(--blue); }
@keyframes toastIn  { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg0); }
::-webkit-scrollbar-thumb { background: var(--border); }

/* ── MISC ── */
.hidden { display: none !important; }
.text-green { color: var(--green); }
.text-red   { color: var(--red); }
.text-yellow { color: var(--yellow); }
canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
<div id="game-container">

  <!-- ─── FLOATING HUD ─── -->
  <div id="top-hud">
    <div class="hud-cell"><span class="hud-icon">💰</span><span id="hud-money">5,000</span></div>
    <div class="hud-cell logo-small">NITRO<span>FORGE</span></div>
    <div class="hud-cell"><span class="hud-icon">⚡</span>LV<span id="hud-level">1</span></div>

// ===== js/audio.js =====
// ===== NITRO FORGE - AUDIO.JS =====

const Audio = (() => {
  let ctx = null;
  let engineNode = null, gainNode = null, distNode = null;
  let currentRpm = 800;
  let nosNode = null, nosGain = null;
  let enabled = true;

  function init() {
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = ctx.createGain();
      gainNode.gain.value = 0.18;
      distNode = ctx.createWaveShaper();
      distNode.curve = makeDistortionCurve(60);
      distNode.connect(gainNode);
      gainNode.connect(ctx.destination);

      engineNode = ctx.createOscillator();
      engineNode.type = 'sawtooth';
      engineNode.frequency.value = rpmToFreq(800);
      engineNode.connect(distNode);
      engineNode.start();
    } catch(e) { enabled = false; }
  }

  function rpmToFreq(rpm) {
    return 30 + (rpm / 10500) * 140;
  }

  function makeDistortionCurve(amount) {
    const n = 256, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  function setRpm(rpm, instant = false) {
    if (!enabled || !ctx || !engineNode) return;
    currentRpm = rpm;
    const freq = rpmToFreq(rpm);
    const vol = 0.05 + (rpm / 10500) * 0.22;
    if (instant) {
      engineNode.frequency.value = freq;
      gainNode.gain.value = vol;
    } else {
      engineNode.frequency.setTargetAtTime(freq, ctx.currentTime, 0.04);
      gainNode.gain.setTargetAtTime(vol, ctx.currentTime, 0.04);
    }
  }

  function playShift() {
    if (!enabled || !ctx) return;
    // Brief blip: RPM drop sound
    const blip = ctx.createOscillator();
    const g = ctx.createGain();
    blip.type = 'sawtooth';
    blip.frequency.value = rpmToFreq(currentRpm);
    blip.frequency.setTargetAtTime(rpmToFreq(currentRpm * 0.65), ctx.currentTime, 0.02);
    g.gain.value = 0.12;
    g.gain.setTargetAtTime(0, ctx.currentTime + 0.15, 0.03);
    blip.connect(g);
    g.connect(ctx.destination);
    blip.start();
    blip.stop(ctx.currentTime + 0.3);
  }

  function playPerfectShift() {
    if (!enabled || !ctx) return;
    playShift();
    // Metallic ping
    const ping = ctx.createOscillator();
    const pg = ctx.createGain();
    ping.type = 'sine';
    ping.frequency.value = 1400;
    pg.gain.value = 0.06;
    pg.gain.setTargetAtTime(0, ctx.currentTime + 0.05, 0.06);
    ping.connect(pg);
    pg.connect(ctx.destination);
    ping.start();
    ping.stop(ctx.currentTime + 0.3);
  }

  function playLaunch() {
    if (!enabled || !ctx) return;
    const noise = ctx.createOscillator();
    const ng = ctx.createGain();
    noise.type = 'sawtooth';
    noise.frequency.value = 80;
    noise.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.4);
    ng.gain.value = 0.25;
    ng.gain.setTargetAtTime(0.1, ctx.currentTime + 0.3, 0.1);
    noise.connect(ng);
    ng.connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + 0.8);
  }

  function startNos() {
    if (!enabled || !ctx) return;
    if (nosNode) return;
    nosNode = ctx.createOscillator();
    nosGain = ctx.createGain();
    nosNode.type = 'sine';
    nosNode.frequency.value = 3200;
    nosGain.gain.value = 0;
    nosGain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 0.1);
    nosNode.connect(nosGain);
    nosGain.connect(ctx.destination);
    nosNode.start();
  }

  function stopNos() {
    if (!nosNode) return;
    nosGain.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
    nosNode.stop(ctx.currentTime + 0.2);
    nosNode = null; nosGain = null;
  }

  function playRedline() {
    if (!enabled || !ctx) return;
    const r = ctx.createOscillator();
    const rg = ctx.createGain();
    r.type = 'square';
    r.frequency.value = 55;
    rg.gain.value = 0.07;
    rg.gain.setTargetAtTime(0, ctx.currentTime + 0.1, 0.02);
    r.connect(rg);
    rg.connect(ctx.destination);
    r.start();
    r.stop(ctx.currentTime + 0.2);
  }

  function idle() {
    setRpm(850 + Math.random() * 50);
  }

  function resume() {
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  return { init, setRpm, playShift, playPerfectShift, playLaunch, startNos, stopNos, playRedline, idle, resume };
})();

class Car {
  constructor(carId, config) {
    this.carId = carId;
    this.data = CARS_DATA[carId];
    this.config = config || defaultCarConfig(carId);
    this._computeStats();
  }

  _computeStats() {
    const d = this.data, m = this.config.mods;
    let hp = d.baseHp;
    hp += MODS.engine[m.engine].hp;
    hp += MODS.forced[m.forced].hp;
    hp += MODS.exhaust[m.exhaust].hp;
    hp += MODS.intake[m.intake].hp;
    hp *= (1 + MODS.ecu[m.ecu].boost);

    const weight = d.baseWeight - MODS.weight[m.weight].reduction;
    const grip = d.baseGrip * MODS.tires[m.tires].grip / 0.70;
    const clampedGrip = Math.min(1.0, Math.max(0.5, grip));
    const shiftBonus = MODS.transmission[m.transmission].shiftBonus;
    const launchBonus = MODS.suspension[m.suspension].launch;

    const nos = MODS.nitrous[m.nitrous];
    this.nosHp = nos.hp;
    this.nosDuration = nos.dur;
    this.hasNos = nos.hp > 0;

    this.hp = Math.round(hp);
    this.weight = weight;
    this.grip = clampedGrip;
    this.shiftBonus = shiftBonus;
    this.launchBonus = launchBonus;
    this.gears = d.gears;
    this.redline = d.redline;
    this.color = this.config.color;

    // Scale max speeds by power ratio
    const powerRatio = hp / d.baseHp;
    const speedScale = Math.pow(powerRatio, 0.32);
    this.maxSpeedByGear = d.maxSpeedByGear.map(s => Math.round(s * speedScale));

    // Performance rating
    this.rating = Math.min(999, Math.round(
      this.hp * 0.45 + (this.hp / this.weight * 1000) * 14 + clampedGrip * 80
    ));

    // Launch RPM
    const launchPct = (this.config.tune?.launchRpm ?? 0.55) + launchBonus;
    this.launchRpm = Math.round(this.redline * Math.min(0.85, launchPct));
  }

  getStatPercents() {
    return {
      hp: Math.min(100, this.hp / 12),
      wt: Math.max(0, 100 - (this.weight - 2000) / 30),
      gr: this.grip * 100,
      pr: Math.min(100, this.rating / 10),
    };
  }

  draw(ctx, x, y, scale = 1, flip = false) {
    CarRenderer.draw(ctx, x, y, this.data.drawType, this.color, scale, flip);
  }
}

// Helper to build an opponent Car object
function buildOpponentCar(opponentData) {
  const carData = CARS_DATA[opponentData.carId];
  const config = {
    color: carData.defaultColor,
    mods: { ...MOD_PRESETS[opponentData.modPreset] },
    tune: { launchRpm: 0.55, finalDrive: 1.0 },
  };

// ===== js/race.js =====
// ===== NITRO FORGE - RACE.JS =====

const Race = (() => {
  // ── STATE ──
  let state = 'idle'; // idle | staging | staged | countdown | racing | finished
  let playerCar, opponentCar, opponentData;
  let raceCanvas, rCtx;
  let animId = null;

  // Physics
  let pSpeed = 0, oSpeed = 0;
  let pDist = 0, oDist = 0;
  let pRpm = 0, oRpm = 0;
  let pGear = 0, oGear = 0;
  let pNosActive = false, pNosTime = 0;
  let pLaunchHeld = false;
  let pReactionStart = 0, pReactionTime = 0;
  let raceTime = 0, raceStartTime = 0;
  let lastFrame = 0;
  let raceFinished = false;
  let lastShiftRpm = 0;

  // AI
  let oLaunchDelay = 0, oShiftPoints = [];
  let oNosUsed = false, oNosTimer = 0;

  // Tree
  let treeStage = -1;
  let treeTimer = 0;
  let greenLit = false;

  // Track
  const TRACK_LENGTH_FT = 1320; // quarter mile = 1320 ft
  const MPH_TO_FPS = 1.46667;
  const FPS_TO_MPH = 1 / MPH_TO_FPS;

  // Canvas
  let bgOffset = 0;
  const CAR_SCALE = 1.6;

  function init(canvas) {
    raceCanvas = canvas;
    rCtx = canvas.getContext('2d');
    resizeCanvas();
  }

  function resizeCanvas() {
    raceCanvas.width = raceCanvas.offsetWidth || 480;
    raceCanvas.height = raceCanvas.offsetHeight || 340;
  }

  function setup(pCar, oCar, oData) {
    playerCar = pCar;
    opponentCar = oCar;
    opponentData = oData;

    pSpeed = 0; oSpeed = 0; pDist = 0; oDist = 0;
    pRpm = 0;   oRpm = 800; pGear = 0; oGear = 1;
    pNosActive = false; pNosTime = 0; pNosTimer = 0;
    pLaunchHeld = false;
    pReactionStart = 0; pReactionTime = 0;
    raceTime = 0; raceStartTime = 0;
    raceFinished = false; lastShiftRpm = 0;
    greenLit = false; treeStage = -1;
    bgOffset = 0;

    // AI shift points: shift at 88-96% redline depending on skill
    const skill = opponentData.skill;
    oLaunchDelay = 0.3 + (1 - skill) * 0.5 + Math.random() * 0.2;
    oShiftPoints = [];
    oNosUsed = false; oNosTimer = 0;

    state = 'staging';
    updateActionBtn();
    updateTreeLights(-1);
    document.getElementById('race-status-text').textContent = 'STAGE';
    document.getElementById('btn-nos').disabled = !playerCar.hasNos;
  }

  function mainAction() {
    Audio.resume();
    if (state === 'staging') {
      state = 'staged';
      pReactionStart = performance.now();
      startTree();
      document.getElementById('race-status-text').textContent = 'READY';
      updateActionBtn();
    } else if (state === 'racing' && pGear < playerCar.gears) {
      doShift();
    }
  }

  function startTree() {
    treeStage = 0;
    const intervals = [600, 600, 600, 600, 600]; // yellow1, yellow2, yellow3, yellow4, green
    let delay = 0;
    intervals.forEach((ms, i) => {
      delay += ms;
      setTimeout(() => {
        if (state === 'finished' || state === 'idle') return;
        treeStage = i;
        updateTreeLights(i);
        if (i === 4) {
          greenLit = true;
          go();
        }
      }, delay);
    });
  }

  function updateTreeLights(stage) {
    const ids = ['tl-s1','tl-s2','tl-a1','tl-a2','tl-a3','tl-a4','tl-g1','tl-g2'];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.classList.remove('on'); }
    });
    if (stage >= 0) { document.getElementById('tl-s1')?.classList.add('on'); document.getElementById('tl-s2')?.classList.add('on'); }
    if (stage >= 1) { document.getElementById('tl-a1')?.classList.add('on'); document.getElementById('tl-a2')?.classList.add('on'); }
    if (stage >= 2) { document.getElementById('tl-a3')?.classList.add('on'); document.getElementById('tl-a4')?.classList.add('on'); }
    if (stage >= 4) { document.getElementById('tl-g1')?.classList.add('on'); document.getElementById('tl-g2')?.classList.add('on'); }
  }

  function go() {
    if (state === 'finished') return;
    state = 'racing';
    pReactionTime = (performance.now() - pReactionStart) / 1000;
    raceStartTime = performance.now();
    pGear = 1;
    pRpm = playerCar.launchRpm;
    pSpeed = 2;
    Audio.playLaunch();
    document.getElementById('race-status-text').textContent = 'GO!';
    updateActionBtn();
    setTimeout(() => {
      if (state === 'racing') document.getElementById('race-status-text').textContent = 'RACING';
    }, 600);
  }

  function doShift() {
    if (pGear >= playerCar.gears) return;
    const rpmPct = pRpm / playerCar.redline;
    let quality = 'late';
    let bonusMult = 1.0;

    if (rpmPct >= 0.96 && rpmPct <= 1.0) {
      quality = 'perfect';
      bonusMult = 1.0 + 0.04 + playerCar.shiftBonus;
      showShiftMsg('PERFECT!', 'perfect');
      triggerPerfectFlash();
      Audio.playPerfectShift();
      Game.addCombo();
    } else if (rpmPct >= 0.88) {
      quality = 'good';
      bonusMult = 1.0 + 0.015 + playerCar.shiftBonus;
      showShiftMsg('GOOD', 'good');
      Audio.playShift();
    } else if (rpmPct >= 0.72) {
      quality = 'early';
      bonusMult = 1.0 - 0.02;
      showShiftMsg('EARLY', 'early');
      Audio.playShift();
    } else {
      bonusMult = 1.0 - 0.06;
      showShiftMsg('LATE', 'late');
      Audio.playShift();
    }

    pGear++;
    pRpm = playerCar.redline * 0.52 * bonusMult;
    pSpeed *= (0.95 + playerCar.shiftBonus * 0.3);
    lastShiftRpm = pRpm;
    updateActionBtn();
  }

  function showShiftMsg(text, cls) {
    const el = document.getElementById('shift-msg');
    el.textContent = text;
    el.className = 'shift-msg show ' + cls;
    setTimeout(() => el.className = 'shift-msg', 900);
  }

  function triggerPerfectFlash() {
    const el = document.getElementById('race-perfect-flash');
    el.classList.remove('hidden', 'show');
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 300);
  }

  function activateNos() {
    if (!playerCar.hasNos || pNosActive || pNosTime >= playerCar.nosDuration || state !== 'racing') return;
    pNosActive = true;
    Audio.startNos();
    UI.toast('⚡ NOS ACTIVATED!', 'info');
  }

  // ── PHYSICS UPDATE ──
  function physicsStep(dt) {
    if (state !== 'racing' || raceFinished) return;
    raceTime = (performance.now() - raceStartTime) / 1000;

    // ── PLAYER PHYSICS ──
    const pMaxSpd = playerCar.maxSpeedByGear[pGear - 1] || 0;
    let pHpEff = playerCar.hp;

    // NOS
    if (pNosActive) {
      pNosTime += dt;
      pHpEff += playerCar.nosHp;
      Audio.startNos();
      if (pNosTime >= playerCar.nosDuration) {
        pNosActive = false;
        Audio.stopNos();
      }
    }

    // Acceleration formula: F = hp * 2.5 / weight, limited by gear top speed
    const pAccel = Math.max(0, (pHpEff * 2.5 / playerCar.weight) * (1 - pSpeed / pMaxSpd) * playerCar.grip * 2.0);
    pSpeed = Math.min(pMaxSpd, pSpeed + pAccel * dt * 60);

    // Auto-shift hint at redline
    const targetRpm = playerCar.redline * (pSpeed / pMaxSpd);
    pRpm = Math.max(pRpm * 0.85 + targetRpm * 0.15, 1200);
    if (pRpm >= playerCar.redline * 0.99 && pGear < playerCar.gears) {
      Audio.playRedline();
    }

    pDist += pSpeed * MPH_TO_FPS * dt;

    // Audio rpm
    Audio.setRpm(pRpm);
    updateNosBar();

    // ── AI PHYSICS ──
    const oCar = opponentCar;
    oLaunchDelay -= dt;
    if (oLaunchDelay <= 0 && oGear === 1 && oSpeed < 5) {
      oSpeed = 3 + opponentData.skill * 5;
    }

    // AI gear shift
    const oMaxSpd = oCar.maxSpeedByGear[oGear - 1] || 190;
    if (oGear < oCar.gears) {
      const oRpmPct = oSpeed / oMaxSpd;
      const shiftAt = 0.85 + opponentData.skill * 0.12 + (Math.random() - 0.5) * 0.04;
      if (oRpmPct >= shiftAt) {
        oGear++;
        oSpeed *= 0.96;
      }
    }

    // AI NOS
    if (!oNosUsed && oCar.hasNos && oDist > 200 && opponentData.skill > 0.6) {
      oNosUsed = true; oNosTimer = oCar.nosDuration;
    }
    let oHpEff = oCar.hp;
    if (oNosTimer > 0) { oHpEff += oCar.nosHp; oNosTimer -= dt; }

    const oAccel = Math.max(0, (oHpEff * 2.5 / oCar.weight) * (1 - oSpeed / oMaxSpd) * oCar.grip * 2.0);
    // Skill affects accuracy
    const skillMod = opponentData.skill + (Math.random() - 0.5) * 0.08;
    oSpeed = Math.min(oMaxSpd, oSpeed + oAccel * dt * 60 * skillMod);
    oDist += oSpeed * MPH_TO_FPS * dt;

    // ── FINISH CHECK ──
    const pFinished = pDist >= TRACK_LENGTH_FT;
    const oFinished = oDist >= TRACK_LENGTH_FT;
    if (pFinished || oFinished) {
      raceFinished = true;
      finishRace(pFinished, oFinished);
    }

    // Update HUD
    updateRaceHud();
  }

  function updateNosBar() {
    const pct = playerCar.hasNos ? Math.max(0, 1 - pNosTime / playerCar.nosDuration) * 100 : 0;
    document.getElementById('nos-bar-fill').style.height = pct + '%';
    document.getElementById('btn-nos').disabled = !playerCar.hasNos || pNosActive || pNosTime >= playerCar.nosDuration || state !== 'racing';
  }

  function updateRaceHud() {
    document.getElementById('r-time').textContent = raceTime.toFixed(3);
    document.getElementById('r-dist').textContent = Math.round(pDist) + ' ft';
    document.getElementById('r-speed').textContent = Math.round(pSpeed);
    document.getElementById('r-gear').textContent = pGear === 0 ? 'N' : pGear;
    drawRpmGauge();
  }

  function drawRpmGauge() {
    const canvas = document.getElementById('rpm-gauge');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#0c0c1a';
    ctx.fillRect(0, 0, w, h);

    const segments = playerCar.gears;
    const segW = w / (playerCar.redline / 1000);
    const rpmK = playerCar.redline / 1000;

    // Colored zones
    for (let k = 0; k <= rpmK; k++) {
      const x = (k / rpmK) * w;
      const isRed = k >= rpmK * 0.88;
      const isYellow = k >= rpmK * 0.72 && !isRed;
      ctx.fillStyle = isRed ? '#330008' : isYellow ? '#2a2200' : '#0a0a18';
      ctx.fillRect(x, 0, w / rpmK, h - 12);
    }

    // Fill
    const fillPct = Math.min(1, pRpm / playerCar.redline);
    const fillColor = fillPct > 0.88 ? '#ff1144' : fillPct > 0.72 ? '#ffcc00' : '#39ff14';
    ctx.fillStyle = fillColor;
    ctx.fillRect(0, 0, fillPct * w, h - 12);

    // Glow
    if (fillPct > 0.72) {
      ctx.shadowColor = fillColor;
      ctx.shadowBlur = 6;
      ctx.fillRect(fillPct * w - 3, 0, 3, h - 12);
      ctx.shadowBlur = 0;
    }

    // RPM ticks
    ctx.fillStyle = '#444466';
    for (let k = 0; k <= rpmK; k++) {
      const x = (k / rpmK) * w;
      ctx.fillRect(x, h - 12, 1, 12);
    }
    // Labels
    ctx.fillStyle = '#778';
    ctx.font = '7px Share Tech Mono';
    for (let k = 0; k <= rpmK; k += 2) {
      const x = (k / rpmK) * w;
      ctx.fillText(k, x + 1, h - 1);
    }
  }

  function updateActionBtn() {
    const btn = document.getElementById('btn-race-main');
    if (!btn) return;
    if (state === 'staging') {
      btn.textContent = '▶ STAGE';
      btn.className = 'btn btn-launch';
    } else if (state === 'staged' || state === 'countdown') {
      btn.textContent = '⚡ ARMED';
      btn.className = 'btn btn-launch armed';
    } else if (state === 'racing') {
      if (pGear >= playerCar.gears) {
        btn.textContent = '🔴 REDLINE';
        btn.className = 'btn btn-launch';
      } else {
        btn.textContent = '🔼 SHIFT — ' + (pGear + 1);
        btn.className = 'btn btn-launch shift-mode';
      }
    }
  }

  // ── TRACK RENDERING ──
  function drawTrack() {
    const c = rCtx;
    const W = raceCanvas.width, H = raceCanvas.height;
    const trackH = H * 0.62;

    // Sky gradient
    const skyGrad = c.createLinearGradient(0, 0, 0, trackH);
    skyGrad.addColorStop(0, '#05050d');
    skyGrad.addColorStop(1, '#0d0d22');
    c.fillStyle = skyGrad;
    c.fillRect(0, 0, W, trackH);

    // Stars
    c.fillStyle = 'rgba(255,255,255,0.6)';
    const stars = [[22,8],[80,15],[130,5],[190,18],[250,9],[310,14],[370,6],[420,11],[60,22],[170,25],[280,20],[400,18]];
    stars.forEach(([sx,sy]) => c.fillRect(sx, sy, 1, 1));

    // Horizon glow
    const hGrad = c.createLinearGradient(0, trackH - 20, 0, trackH);
    hGrad.addColorStop(0, 'transparent');
    hGrad.addColorStop(1, 'rgba(57,255,20,0.08)');
    c.fillStyle = hGrad;
    c.fillRect(0, 0, W, trackH);

    // Road
    const roadGrad = c.createLinearGradient(0, trackH, 0, H);
    roadGrad.addColorStop(0, '#1a1a2a');
    roadGrad.addColorStop(1, '#0d0d18');
    c.fillStyle = roadGrad;
    c.fillRect(0, trackH, W, H - trackH);

    // Road edge lines
    c.strokeStyle = '#ffcc00';
    c.lineWidth = 2;
    c.setLineDash([]);
    c.beginPath(); c.moveTo(0, trackH); c.lineTo(W, trackH); c.stroke();
    c.beginPath(); c.moveTo(0, H - 8); c.lineTo(W, H - 8); c.stroke();

    // Center dashes - moving based on speed
    if (state === 'racing') bgOffset = (bgOffset + pSpeed * 0.15) % 80;
    c.strokeStyle = '#ffffff';
    c.lineWidth = 2;
    c.setLineDash([30, 50]);
    c.lineDashOffset = -bgOffset;
    c.beginPath();
    const laneY = trackH + (H - trackH) / 2;
    c.moveTo(0, laneY); c.lineTo(W, laneY);
    c.stroke();
    c.setLineDash([]);

    // Track markings
    c.fillStyle = '#333344';
    c.fillRect(0, trackH + 4, W, 2);

    // Finish line indicator
    const pPct = Math.min(1, pDist / TRACK_LENGTH_FT);
    const finishX = W * 0.9;
    c.strokeStyle = 'rgba(255,255,255,0.15)';
    c.lineWidth = 3;
    c.setLineDash([6, 6]);
    c.beginPath(); c.moveTo(finishX, trackH); c.lineTo(finishX, H - 8); c.stroke();
    c.setLineDash([]);
  }

  function drawCars() {
    const c = rCtx;
    const W = raceCanvas.width, H = raceCanvas.height;
    const trackH = H * 0.62;
    const laneH = H - trackH;

    // Calculate relative positions
    const range = TRACK_LENGTH_FT;
    const pPct = Math.min(1, pDist / range);
    const oPct = Math.min(1, oDist / range);

    // Player car: anchored at ~30% of screen, track scrolls
    const pCarX = W * 0.22;
    const pCarY = trackH + laneH * 0.1;

    // Opponent car: positioned relative to player
    const diffFt = oDist - pDist;
    const diffPx = diffFt * 0.85; // pixels per foot scale
    const oCarX = pCarX + diffPx;
    const oCarY = trackH - laneH * 0.05;

    // Draw opponent
    if (oCarX > -120 && oCarX < W + 60) {
      c.globalAlpha = 0.9;
      opponentCar.draw(c, oCarX, oCarY, CAR_SCALE, false);
      c.globalAlpha = 1;
      // Opponent label
      c.fillStyle = 'rgba(0,0,0,0.5)';
      c.fillRect(oCarX, oCarY - 14, 80, 12);
      c.fillStyle = '#778';
      c.font = '8px Share Tech Mono';
      c.fillText(opponentData.name.substring(0,12), oCarX + 2, oCarY - 4);
    }

    // Draw player car
    playerCar.draw(c, pCarX, pCarY, CAR_SCALE, false);

    // NOS flame effect
    if (pNosActive) {
      drawFlame(c, pCarX - 8, pCarY + 20 * CAR_SCALE, CAR_SCALE);
    }

    // Speed lines
    if (pSpeed > 80) {
      drawSpeedLines(c, W, trackH, H, pSpeed);
    }

    // Mini-map progress
    drawProgressBar(c, W, H, pPct, oPct);
  }

  function drawFlame(c, x, y, s) {
    const cols = ['#ff4400','#ff8800','#ffcc00','#ffffff'];
    for (let i = 0; i < 4; i++) {
      c.fillStyle = cols[i];
      const fw = (4 - i) * s * 2;
      const fh = (8 + i * 4 + Math.random() * 6) * s;
      c.fillRect(x - fw / 2 - i * s * 3, y - fh / 2, fw, fh);
    }
  }

  function drawSpeedLines(c, W, trackH, H, speed) {
    const alpha = Math.min(0.25, (speed - 80) / 200);
    c.strokeStyle = `rgba(200,200,255,${alpha})`;
    c.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const y = trackH + Math.random() * (H - trackH);
      const len = 30 + Math.random() * 60;
      c.beginPath();
      c.moveTo(Math.random() * W * 0.4, y);
      c.lineTo(Math.random() * W * 0.4 + len, y);
      c.stroke();
    }
  }

  function drawProgressBar(c, W, H, pPct, oPct) {
    const barW = W - 20, barH = 6, barX = 10, barY = H - 6;
    c.fillStyle = '#1a1a2a';
    c.fillRect(barX, barY, barW, barH);
    // Track line
    c.fillStyle = '#2a2a4a';
    c.fillRect(barX, barY + 2, barW, 2);
    // Player dot
    c.fillStyle = '#39ff14';
    c.fillRect(barX + pPct * barW - 3, barY, 6, barH);
    // Opponent dot
    c.fillStyle = '#ff4400';
    c.fillRect(barX + oPct * barW - 2, barY + 1, 4, barH - 2);
  }

  function drawIdle() {
    const c = rCtx;
    const W = raceCanvas.width, H = raceCanvas.height;
    c.clearRect(0, 0, W, H);
    drawTrack();

    const trackH = H * 0.62;
    const laneH = H - trackH;

    // Both cars staged
    playerCar.draw(c, W * 0.1, trackH + laneH * 0.1, CAR_SCALE);
    if (opponentCar) opponentCar.draw(c, W * 0.1, trackH - laneH * 0.05, CAR_SCALE);

    // Staging glow
    c.fillStyle = 'rgba(57,255,20,0.06)';
    c.fillRect(0, trackH - 10, W, laneH + 10);

    // Beam
    c.strokeStyle = 'rgba(255,200,0,0.3)';
    c.lineWidth = 1;
    c.setLineDash([2, 4]);
    c.beginPath(); c.moveTo(W * 0.4, trackH); c.lineTo(W * 0.4, H - 8); c.stroke();
    c.setLineDash([]);
  }

  // ── MAIN LOOP ──
  function loop(ts) {
    animId = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - lastFrame) / 1000);
    lastFrame = ts;

    const c = rCtx;
    const W = raceCanvas.width, H = raceCanvas.height;
    c.clearRect(0, 0, W, H);

    if (state === 'staging' || state === 'staged') {
      drawIdle();
    } else if (state === 'racing' || state === 'finished') {
      physicsStep(dt);
      drawTrack();
      drawCars();
    } else {
      drawTrack();
    }
  }

  function start() {
    if (animId) cancelAnimationFrame(animId);
    lastFrame = performance.now();
    animId = requestAnimationFrame(loop);
  }

  function stop() {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    Audio.idle();
    Audio.stopNos();
  }

  function finishRace(pWon, oWon) {
    state = 'finished';
    Audio.stopNos();
    Audio.idle();

    let topSpeed = Math.round(Math.max(pSpeed, 0));
    let et = raceTime.toFixed(3);
    let result = pWon && !oWon ? 'win' : !pWon && oWon ? 'lose' : 'draw';
    let reactionStr = pReactionTime.toFixed(3);

    // Record keeping
    Game.recordRace({
      carId: playerCar.carId,
      et: parseFloat(et),
      topSpeed,
      result,
      reaction: parseFloat(reactionStr),
    });

    // Rewards
    let cashEarned = 0, xpEarned = 0;
    if (result === 'win') {
      cashEarned = opponentData.reward;
      xpEarned = opponentData.xp;
    } else if (result === 'draw') {
      cashEarned = Math.round(opponentData.reward * 0.3);
      xpEarned = Math.round(opponentData.xp * 0.4);
    } else {
      cashEarned = Math.round(opponentData.reward * 0.08);
      xpEarned = Math.round(opponentData.xp * 0.2);
    }

    Game.addCash(cashEarned);
    Game.addXP(xpEarned);

    setTimeout(() => {
      stop();
      showResults(result, et, topSpeed, reactionStr, cashEarned, xpEarned);
    }, 800);
  }

  function showResults(result, et, topSpeed, reaction, cash, xp) {
    const banner = document.getElementById('results-banner');
    banner.textContent = result === 'win' ? 'VICTORY!' : result === 'lose' ? 'DEFEAT' : 'DRAW';
    banner.className = result;

    const oET = (raceTime + (opponentData.skill > 0.7 ? -0.1 : 0.15) * (1 - opponentData.skill)).toFixed(3);
    document.getElementById('results-winner-text').textContent =
      result === 'win' ? `You beat ${opponentData.name}!` :
      result === 'lose' ? `${opponentData.name} wins this round.` :
      'Too close to call!';

    document.getElementById('results-stats-grid').innerHTML = `
      <div class="res-stat"><div class="res-stat-label">YOUR ET</div><div class="res-stat-value good">${et}s</div></div>
      <div class="res-stat"><div class="res-stat-label">OPP ET</div><div class="res-stat-value">${oET}s</div></div>
      <div class="res-stat"><div class="res-stat-label">TOP SPEED</div><div class="res-stat-value highlight">${topSpeed} mph</div></div>
      <div class="res-stat"><div class="res-stat-label">REACTION</div><div class="res-stat-value">${reaction}s</div></div>
    `;

    document.getElementById('results-rewards-box').innerHTML = `
      <div class="reward-line">💰 +$${cash.toLocaleString()}</div>
      <div class="reward-line">⭐ +${xp} XP</div>
    `;

    UI.show('results');
  }

  function restart() {
    if (!opponentData) return;
    playerCar._computeStats();
    setup(playerCar, opponentCar, opponentData);
    UI.show('race');
    start();
  }

  function getCurrentOpponent() { return opponentData; }
  function getState() { return state; }

  return {
    init, setup, start, stop,
    mainAction, activateNos, restart,
    getCurrentOpponent, getState,
  };
})();

const Garage = (() => {

  function render() {
    renderCarDisplay();
    renderTab(activeTab);
    setupTabBtns();
    setupCarNav();
  }

  function renderCarDisplay() {
    const car = Game.getActiveCar();

    // Canvas
    const canvas = document.getElementById('garage-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    car.draw(ctx, 40, 20, 2.0);

    document.getElementById('garage-car-name').textContent = car.data.name;

    document.getElementById('stat-hp-bar').style.width = pct.hp + '%';
    document.getElementById('stat-hp-val').textContent = car.hp + ' HP';
    document.getElementById('stat-wt-bar').style.width = pct.wt + '%';
    document.getElementById('stat-wt-val').textContent = car.weight + ' lb';
    document.getElementById('stat-gr-bar').style.width = pct.gr + '%';
    document.getElementById('stat-gr-val').textContent = (car.grip * 100).toFixed(0) + '%';
    document.getElementById('stat-pr-bar').style.width = pct.pr + '%';
    document.getElementById('stat-pr-val').textContent = car.rating + ' PR';
  }

  function setupTabBtns() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        renderTab(activeTab);
      };
    });
  }

  function setupCarNav() {
    document.getElementById('prev-car-btn').onclick = () => {
      Game.prevCar(); render();
    };
    document.getElementById('next-car-btn').onclick = () => {
      Game.nextCar(); render();
    };
  }

  function renderTab(tab) {
    const el = document.getElementById('garage-tab-content');
    if (tab === 'mods')   el.innerHTML = buildModsHTML();
    if (tab === 'paint')  el.innerHTML = buildPaintHTML();
    if (tab === 'tune')   el.innerHTML = buildTuneHTML();
    if (tab === 'info')   el.innerHTML = buildInfoHTML();
    attachTabEvents(tab);
  }

  function buildModsHTML() {
    const car = Game.getActiveCar();
    const mods = car.config.mods;
    const cash = Game.getCash();

    const categories = [
      { key: 'engine',      label: '🔧 ENGINE INTERNALS' },
      { key: 'forced',      label: '💨 FORCED INDUCTION' },
      { key: 'exhaust',     label: '🔊 EXHAUST' },
      { key: 'intake',      label: '🌬️ INTAKE' },
      { key: 'tires',       label: '🛞 TIRES' },
      { key: 'suspension',  label: '🏗️ SUSPENSION' },
      { key: 'nitrous',     label: '⚡ NITROUS' },
      { key: 'transmission',label: '⚙️ TRANSMISSION' },
      { key: 'weight',      label: '⚖️ WEIGHT REDUCTION' },
      { key: 'ecu',         label: '💻 ECU' },
    ];

    return categories.map(cat => {
      const options = MODS[cat.key];
      const owned = Game.getOwnedMods(car.carId, cat.key);
      const active = mods[cat.key];

      const optionHTML = options.map((opt, i) => {
        const isActive = i === active;
        const isOwned = owned.includes(i) || i === 0;
        const canAfford = cash >= opt.price;
        const cls = isActive ? 'mod-option active' : isOwned ? 'mod-option' : canAfford ? 'mod-option' : 'mod-option locked';
        const priceText = i === 0 ? '<span class="mod-price owned">STOCK</span>'
          : isOwned ? '<span class="mod-price owned">OWNED</span>'
          : `<span class="mod-price ${canAfford ? '' : 'text-red'}">$${opt.price.toLocaleString()}</span>`;

        const hpLabel = opt.hp ? `+${opt.hp}hp` : opt.grip ? `grip ${opt.grip}` : opt.label || '';

        return `<div class="mod-option ${isActive ? 'active' : isOwned ? '' : 'buyable'}" 
                  data-category="${cat.key}" data-index="${i}" 
                  style="${isOwned || i===0 ? 'cursor:pointer' : canAfford ? 'cursor:pointer' : 'cursor:not-allowed; opacity:0.45'}">
          <span class="mod-name">${opt.name}</span>
          <span class="mod-hp">${hpLabel}</span>

      return `<div class="mod-category">
        <div class="mod-category-title">${cat.label}</div>
        <div class="mod-options">${optionHTML}</div>
      </div>`;
    }).join('');

  function buildPaintHTML() {
    const car = Game.getActiveCar();
    const currentColor = car.config.color;

    const swatches = PAINT_COLORS.map(c =>
      `<div class="paint-swatch ${c === currentColor ? 'active' : ''}" 
          data-color="${c}" style="background:${c}"></div>`
    ).join('');

    return `<div style="padding:8px 0">
      <div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;letter-spacing:1px;">SELECT PAINT COLOR</div>
      <div class="paint-grid">${swatches}</div>
      <div style="margin-top:12px;font-size:10px;color:var(--text-dim)">
        Custom hex: <input id="custom-color-input" type="color" value="${currentColor}" style="margin-left:6px;width:40px;height:24px;cursor:pointer;border:none;background:none;">
      </div>
    </div>`;
  }

  function buildTuneHTML() {
    const car = Game.getActiveCar();
    const tune = car.config.tune;
    const launchPct = Math.round((tune.launchRpm || 0.55) * 100);
    const fd = tune.finalDrive || 1.0;

    return `<div class="tune-section">
      <div style="font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-bottom:10px;">⚙️ FINE TUNE YOUR SETUP</div>
      
      <div class="tune-item">
        <span class="tune-label">LAUNCH RPM %</span>
        <input type="range" class="tune-slider" id="tune-launch" min="30" max="85" value="${launchPct}">
        <span class="tune-value" id="tune-launch-val">${launchPct}%</span>
      </div>
      <div style="font-size:9px;color:var(--text-dim);padding:0 8px 8px;">Higher = more wheelspin but faster launch if timed right</div>

      <div class="tune-item">
        <span class="tune-label">FINAL DRIVE RATIO</span>
        <input type="range" class="tune-slider" id="tune-fd" min="80" max="120" value="${Math.round(fd * 100)}">
        <span class="tune-value" id="tune-fd-val">${fd.toFixed(2)}</span>
      </div>
      <div style="font-size:9px;color:var(--text-dim);padding:0 8px 8px;">Lower = better top speed, Higher = better acceleration</div>

      <div style="margin-top:12px;padding:8px;background:var(--bg2);border:1px solid var(--border);font-size:10px;color:var(--text-dim)">
        💡 Optimal launch RPM: ~${Math.round(car.data.redline * 0.55 / 100) * 100} — ${Math.round(car.data.redline * 0.72 / 100) * 100}
      </div>

      <button class="btn btn-dim" id="btn-tune-reset" style="margin-top:10px;width:100%">↩ RESET TO DEFAULT</button>
    </div>`;
  }

  function buildInfoHTML() {
    const car = Game.getActiveCar();
    const d = car.data;
    const raceHistory = Game.getRaceHistory(car.carId);
    const bestET = raceHistory.length ? Math.min(...raceHistory.map(r => r.et)).toFixed(3) : '--';
    const wins = raceHistory.filter(r => r.result === 'win').length;
    const losses = raceHistory.filter(r => r.result === 'lose').length;

    return `<div style="padding:8px 0">
      <div class="mod-category-title">📋 CAR INFO</div>
      <div class="record-row"><span>Name</span><span class="text-yellow">${d.name}</span></div>
      <div class="record-row"><span>Class</span><span class="text-yellow">${d.class}</span></div>
      <div class="record-row"><span>Engine</span><span>${car.hp} HP</span></div>
      <div class="record-row"><span>Weight</span><span>${car.weight} lbs</span></div>
      <div class="record-row"><span>Grip</span><span>${(car.grip * 100).toFixed(0)}%</span></div>
      <div class="record-row"><span>Rating</span><span class="text-green">${car.rating} PR</span></div>
      <div class="record-row"><span>Gears</span><span>${car.gears}</span></div>
      <div class="record-row"><span>Redline</span><span>${d.redline.toLocaleString()} RPM</span></div>

      <div class="mod-category-title" style="margin-top:14px;">🏁 RACE STATS</div>
      <div class="record-row"><span>Best ET</span><span class="text-green">${bestET}${bestET !== '--' ? 's' : ''}</span></div>
      <div class="record-row"><span>Wins</span><span class="text-green">${wins}</span></div>
      <div class="record-row"><span>Losses</span><span class="text-red">${losses}</span></div>
      <div class="record-row"><span>W/L Ratio</span><span>${losses > 0 ? (wins/losses).toFixed(2) : wins > 0 ? '∞' : '--'}</span></div>

      <div style="padding:10px 0;font-size:10px;color:var(--text-dim);line-height:1.7">${d.desc}</div>
    </div>`;
  }

  function attachTabEvents(tab) {
    if (tab === 'mods') {
      document.querySelectorAll('.mod-option').forEach(el => {
        el.addEventListener('click', () => {
          const cat = el.dataset.category;
          const idx = parseInt(el.dataset.index);
          handleModClick(cat, idx);
        });
      });
    }

    if (tab === 'paint') {
      document.querySelectorAll('.paint-swatch').forEach(el => {
        el.addEventListener('click', () => {
          const color = el.dataset.color;
          const car = Game.getActiveCar();
          car.config.color = color;
          car._computeStats();
          Game.save();
          render();
        });
      });
      const customInput = document.getElementById('custom-color-input');
      if (customInput) {
        customInput.addEventListener('input', (e) => {
          const car = Game.getActiveCar();
          car.config.color = e.target.value;
          car._computeStats();
          Game.save();
          renderCarDisplay();
        });
      }
    }

    if (tab === 'tune') {
      const launchSlider = document.getElementById('tune-launch');
      const fdSlider = document.getElementById('tune-fd');
      if (launchSlider) {
        launchSlider.addEventListener('input', (e) => {
          const val = parseInt(e.target.value) / 100;
          document.getElementById('tune-launch-val').textContent = Math.round(val * 100) + '%';
          const car = Game.getActiveCar();
          car.config.tune.launchRpm = val;
          car._computeStats();
          Game.save();
        });
      }
      if (fdSlider) {
        fdSlider.addEventListener('input', (e) => {
          const val = parseInt(e.target.value) / 100;
          document.getElementById('tune-fd-val').textContent = val.toFixed(2);
          const car = Game.getActiveCar();
          car.config.tune.finalDrive = val;
          car._computeStats();
          Game.save();
        });
      }
      const resetBtn = document.getElementById('btn-tune-reset');
      if (resetBtn) {
        resetBtn.onclick = () => {
          const car = Game.getActiveCar();
          car.config.tune = { launchRpm: 0.55, finalDrive: 1.0 };
          car._computeStats();
          Game.save();
          renderTab('tune');
          UI.toast('Tune reset to default', 'info');
        };
      }
    }
  }

  function handleModClick(category, index) {
    const car = Game.getActiveCar();
    const mod = MODS[category][index];
    const owned = Game.getOwnedMods(car.carId, category);

    if (index === 0 || owned.includes(index)) {
      // Just equip it
      car.config.mods[category] = index;
      car._computeStats();
      Game.save();
      renderTab('mods');
      renderCarDisplay();
      UI.toast(`Equipped: ${mod.name}`, 'info');
    } else {
      // Try to buy
      if (Game.getCash() < mod.price) {
        UI.toast(`Not enough cash! Need $${mod.price.toLocaleString()}`, 'warn');
        return;
      }
      UI.confirm(
        `Buy <strong>${mod.name}</strong> for <strong>$${mod.price.toLocaleString()}</strong>?`,
        () => {
          Game.spendCash(mod.price);
          Game.addOwnedMod(car.carId, category, index);
          car.config.mods[category] = index;
          car._computeStats();
          Game.save();
          renderTab('mods');
          renderCarDisplay();
          UI.toast(`✅ Installed: ${mod.name}`, 'info');
        }
      );
    }
  }

  return { render };
})();

const UI = (() => {
  let currentScreen = 'title';

  function show(screenName) {
    // Stop race if leaving
    if (currentScreen === 'race' && screenName !== 'race') {
      Race.stop();
    }

    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('screen-' + screenName);
    if (el) el.classList.add('active');
    currentScreen = screenName;

    // Screen-specific inits
    if (screenName === 'title')      renderTitle();
    if (screenName === 'garage')     Garage.render();
    if (screenName === 'shop')       renderShop();
    if (screenName === 'race-menu')  renderRaceMenu();
    if (screenName === 'records')    renderRecords();
    updateHUD();
  }

  function updateHUD() {
    document.getElementById('hud-money').textContent = Game.getCash().toLocaleString();
    document.getElementById('hud-level').textContent = Game.getLevel();
  }

  function renderTitle() {
    const stats = Game.getStats();
    document.getElementById('title-stat-races').textContent = stats.races + ' RACES';
    document.getElementById('title-stat-wins').textContent = stats.wins + ' WINS';
    document.getElementById('title-best-et').textContent = stats.bestET ? 'BEST: ' + stats.bestET + 's' : 'BEST: --.---';

    // Draw title car
    const canvas = document.getElementById('title-car-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const car = Game.getActiveCar();
    if (car) {
      car.draw(ctx, 50, 5, 2.4);
    }
  }

  function renderShop() {
    const shopMoney = document.getElementById('shop-money');
    if (shopMoney) shopMoney.textContent = Game.getCash().toLocaleString();

    const listEl = document.getElementById('car-list');
    const activeFilter = document.querySelector('.filter-btn.active')?.dataset.class || 'all';

    const ownedCars = Game.getOwnedCarIds();
    const activeCar = Game.getActiveCar();

    let carsToShow = Object.values(CARS_DATA).filter(cd =>
      activeFilter === 'all' || cd.class === activeFilter
    );

    listEl.innerHTML = carsToShow.map(cd => {
      const isOwned = ownedCars.includes(cd.id);
      const isActive = activeCar?.carId === cd.id;
      const canAfford = Game.getCash() >= cd.price;

      // Mini car canvas
      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = 90; tmpCanvas.height = 40;
      tmpCanvas.className = 'car-card-canvas';
      const tmpCtx = tmpCanvas.getContext('2d');
      const tmpCar = new Car(cd.id, defaultCarConfig(cd.id));
      tmpCar.draw(tmpCtx, 2, 4, 1.0);
      const imgData = tmpCanvas.toDataURL();

      const classBadge = `<span style="
        background:${classColor(cd.class)};
        color:#000;padding:1px 5px;font-size:9px;font-weight:bold;
        margin-left:4px;
      ">${cd.class}</span>`;

      const actionHTML = isActive
        ? `<span class="text-green" style="font-size:10px">ACTIVE ✓</span>`
        : isOwned
        ? `<button class="btn btn-xs btn-green" data-carid="${cd.id}" data-action="select">SELECT</button>`
        : cd.price === 0
        ? `<button class="btn btn-xs btn-green" data-carid="${cd.id}" data-action="buy">FREE!</button>`
        : canAfford
        ? `<button class="btn btn-xs btn-primary" data-carid="${cd.id}" data-action="buy">BUY $${(cd.price/1000).toFixed(0)}K</button>`
        : `<span class="text-red" style="font-size:9px">$${cd.price.toLocaleString()}</span>`;

      return `
        <div class="car-card ${isOwned ? 'owned' : ''} ${isActive ? 'active-car' : ''}">
          <img src="${imgData}" width="90" height="40" style="image-rendering:pixelated;flex-shrink:0">
          <div class="car-card-info">
            <div class="car-card-name">${cd.name}${classBadge}</div>
            <div class="car-card-class" style="font-size:9px;color:var(--text-dim)">${cd.desc}</div>
            <div class="car-card-stats">
              <span>HP: <span>${cd.baseHp}</span></span>
              <span>WT: <span>${cd.baseWeight}</span></span>
            </div>
          </div>
          <div class="car-card-action">${actionHTML}</div>
        </div>
      `;
    }).join('');

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderShop();
      };
    });

    // Car action buttons
    listEl.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const carId = btn.dataset.carid;
        const action = btn.dataset.action;
        if (action === 'buy') buyCarConfirm(carId);
        if (action === 'select') {
          Game.setActiveCar(carId);
          renderShop();
          updateHUD();
          toast('🚗 ' + CARS_DATA[carId].name + ' selected!', 'info');
        }
      });
    });
  }

  function buyCarConfirm(carId) {
    const cd = CARS_DATA[carId];
    if (cd.price === 0) {
      Game.buyCar(carId);
      Game.setActiveCar(carId);
      renderShop();
      updateHUD();
      toast('🚗 ' + cd.name + ' acquired!', 'info');
      return;
    }
    if (Game.getCash() < cd.price) { toast('Not enough cash!', 'warn'); return; }
    confirm(
      `Buy the <strong>${cd.name}</strong> for <strong>$${cd.price.toLocaleString()}</strong>?`,
      () => {
        Game.spendCash(cd.price);
        Game.buyCar(carId);
        Game.setActiveCar(carId);
        renderShop();
        updateHUD();
        toast('🚗 ' + cd.name + ' purchased!', 'info');
      }
    );
  }

  function classColor(cls) {
    return { D:'#aaaaaa', C:'#44cc44', B:'#4488ff', A:'#cc44ff', S:'#ff8800' }[cls] || '#888';
  }

  function renderRaceMenu() {
    const activeCar = Game.getActiveCar();
    // Preview
    const previewEl = document.getElementById('race-menu-car-preview');
    const pc = document.createElement('canvas');
    pc.width = 110; pc.height = 44;
    pc.style.imageRendering = 'pixelated';
    const pCtx = pc.getContext('2d');
    activeCar.draw(pCtx, 4, 4, 1.3);
    previewEl.innerHTML = '';
    previewEl.appendChild(pc);

    const infoDiv = document.createElement('div');
    infoDiv.style.cssText = 'flex:1;font-size:11px;';
    infoDiv.innerHTML = `
      <div style="font-family:var(--font-title);font-size:13px;color:var(--accent2)">${activeCar.data.name}</div>
      <div style="color:var(--text-dim);margin-top:2px">${activeCar.hp} HP · ${activeCar.rating} PR</div>
    `;
    previewEl.appendChild(infoDiv);

    const raceModeListEl = document.getElementById('race-mode-list');
    raceModeListEl.innerHTML = Object.entries(OPPONENTS).map(([modeKey, opps]) => {
      const modeLabel = { street:'🌃 STREET RACING', track:'🏁 TRACK DAY', touge:'⛰️ TOUGE BATTLE' }[modeKey] || modeKey;

      const rows = opps.map((opp, i) => {
        const oppCar = CARS_DATA[opp.carId];
        const won = Game.hasBeaten(modeKey, i);
        return `<div class="race-entry ${won ? 'text-dim' : ''}" data-mode="${modeKey}" data-index="${i}">
          <span class="race-entry-name">${opp.name} ${won ? '✓' : ''}</span>
          <span class="race-entry-opp" style="font-size:10px;color:var(--text-dim)">${oppCar.name}</span>
          <span class="race-entry-reward">$${opp.reward.toLocaleString()}</span>
        </div>`;
      }).join('');

      return `<div class="race-mode-section">
        <div class="race-mode-header">${modeLabel}</div>
        <div class="race-mode-body">${rows}</div>
      </div>`;
    }).join('');

    raceModeListEl.querySelectorAll('.race-entry').forEach(el => {
      el.addEventListener('click', () => {
        const mode = el.dataset.mode;
        const index = parseInt(el.dataset.index);
        startRace(mode, index);
      });
    });
  }

  function startRace(mode, index) {
    const oppData = OPPONENTS[mode][index];
    const playerCar = Game.getActiveCar();
    const oppCar = buildOpponentCar(oppData);

    const canvas = document.getElementById('race-canvas');
    Race.init(canvas);
    Race.setup(playerCar, oppCar, { ...oppData, mode, index });
    show('race');
    Race.start();
  }

  function renderRecords() {
    const el = document.getElementById('records-content');
    const stats = Game.getStats();
    const history = Game.getAllRaceHistory();

    // Best times per car
    const bestByCarId = {};
    history.forEach(r => {
      if (!bestByCarId[r.carId] || r.et < bestByCarId[r.carId].et) {
        bestByCarId[r.carId] = r;
      }
    });

    const bestRows = Object.values(bestByCarId).sort((a,b) => a.et - b.et).map(r =>
      `<div class="record-row">
        <span class="record-car-name">${CARS_DATA[r.carId]?.name || r.carId}</span>
        <span class="record-et">${r.et.toFixed(3)}s</span>
        <span class="record-speed">${r.topSpeed} mph</span>
      </div>`
    ).join('') || '<div style="color:var(--text-dim);padding:8px;font-size:11px">No races yet</div>';

    el.innerHTML = `
      <div class="record-section">
        <div class="record-section-title">🌟 GLOBAL STATS</div>
        <div class="record-row"><span>Total Races</span><span class="text-yellow">${stats.races}</span></div>
        <div class="record-row"><span>Wins</span><span class="text-green">${stats.wins}</span></div>
        <div class="record-row"><span>Losses</span><span class="text-red">${stats.losses}</span></div>
        <div class="record-row"><span>Cash Earned</span><span class="text-yellow">$${(stats.totalEarned||0).toLocaleString()}</span></div>
        <div class="record-row"><span>Best ET</span><span class="text-green">${stats.bestET ? stats.bestET + 's' : '--'}</span></div>
        <div class="record-row"><span>Top Speed</span><span class="text-green">${stats.topSpeed || '--'} mph</span></div>
      </div>
      <div class="record-section">
        <div class="record-section-title">🏆 BEST TIMES PER CAR</div>
        ${bestRows}
      </div>
    `;
  }

  function toast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  function confirm(msg, onOk) {
    const modal = document.getElementById('modal-overlay');
    const body = document.getElementById('modal-body');
    const btn = document.getElementById('modal-ok-btn');
    body.innerHTML = msg;
    btn.textContent = 'CONFIRM';
    modal.classList.remove('hidden');

    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.onclick = () => {
      modal.classList.add('hidden');
      onOk();
    };

    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    };
  }

  function modalMsg(msg) {
    const modal = document.getElementById('modal-overlay');
    const body = document.getElementById('modal-body');
    const btn = document.getElementById('modal-ok-btn');
    body.innerHTML = msg;
    btn.textContent = 'OK';
    modal.classList.remove('hidden');
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.onclick = () => modal.classList.add('hidden');
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (currentScreen === 'race') {
      if (e.code === 'Space') { e.preventDefault(); Race.mainAction(); }
      if (e.code === 'KeyN')  Race.activateNos();
    }
  });

  return { show, updateHUD, toast, confirm: confirm, modalMsg };
})();

// ─── GAME STATE ───
const Game = (() => {
  const SAVE_KEY = 'nitroforge_save_v1';

  let state = {
    cash: 5000,
    xp: 0,
    level: 1,
    combo: 0,
    activeCarId: 'metro_s',
    ownedCars: { metro_s: defaultCarConfig('metro_s') },
    ownedMods: {},    // { carId: { category: [indices] } }
    beaten: {},       // { "mode_index": true }
    raceHistory: [],  // [{ carId, et, topSpeed, result, reaction }]
    stats: { races:0, wins:0, losses:0, bestET:null, topSpeed:0, totalEarned:0 },
  };

  // ── CARS ──
  function getActiveCar() {
    const carId = state.activeCarId;
    const config = state.ownedCars[carId];
    if (!config) return null;
    return new Car(carId, config);
  }

  function getOwnedCarIds() {
    return Object.keys(state.ownedCars);
  }

  function setActiveCar(carId) {
    if (!state.ownedCars[carId]) return;
    state.activeCarId = carId;
    save();
  }

  function buyCar(carId) {
    if (!state.ownedCars[carId]) {
      state.ownedCars[carId] = defaultCarConfig(carId);
    }
    save();
  }

  function prevCar() {
    const ids = Object.keys(state.ownedCars);
    const idx = ids.indexOf(state.activeCarId);
    state.activeCarId = ids[(idx - 1 + ids.length) % ids.length];
    save();
  }

  function nextCar() {
    const ids = Object.keys(state.ownedCars);
    const idx = ids.indexOf(state.activeCarId);
    state.activeCarId = ids[(idx + 1) % ids.length];
    save();
  }

  // ── MODS ──
  function getOwnedMods(carId, category) {
    return state.ownedMods?.[carId]?.[category] || [];
  }

  function addOwnedMod(carId, category, index) {
    if (!state.ownedMods[carId]) state.ownedMods[carId] = {};
    if (!state.ownedMods[carId][category]) state.ownedMods[carId][category] = [];
    if (!state.ownedMods[carId][category].includes(index)) {
      state.ownedMods[carId][category].push(index);
    }
    // Sync to ownedCars config
    const config = state.ownedCars[carId];
    if (config) config.mods[category] = index;
    save();
  }

  // ── ECONOMY ──
  function getCash() { return state.cash; }
  function addCash(amount) {
    state.cash += amount;
    state.stats.totalEarned = (state.stats.totalEarned || 0) + amount;
    save();
    UI.updateHUD();
  }
  function spendCash(amount) {
    if (state.cash < amount) return false;
    state.cash -= amount;
    save();
    UI.updateHUD();
    return true;
  }

  // ── XP / LEVEL ──
  function getLevel() { return state.level; }
  function addXP(xp) {
    state.xp += xp;
    const nextLevelXP = LEVEL_XP[state.level] || 99999;
    if (state.xp >= nextLevelXP && state.level < LEVEL_XP.length - 1) {
      state.level++;
      UI.toast('⭐ LEVEL UP! You are now Level ' + state.level, 'info');
    }
    save();
    UI.updateHUD();
  }

  // ── COMBO ──
  function addCombo() {
    state.combo = (state.combo || 0) + 1;
    if (state.combo >= 3) {
      addCash(state.combo * 100);
      UI.toast(`🔥 ${state.combo}x COMBO! +$${state.combo * 100}`, 'info');
    }
  }
  function resetCombo() { state.combo = 0; }

  // ── RACE RECORDS ──
  function recordRace(record) {
    state.raceHistory.push(record);
    if (state.raceHistory.length > 200) state.raceHistory.shift(); // cap
    state.stats.races++;
    if (record.result === 'win') state.stats.wins++;
    if (record.result === 'lose') { state.stats.losses++; resetCombo(); }
    if (!state.stats.bestET || record.et < state.stats.bestET) state.stats.bestET = record.et;
    if (record.topSpeed > (state.stats.topSpeed || 0)) state.stats.topSpeed = record.topSpeed;
    save();
  }

  function getRaceHistory(carId) {
    return state.raceHistory.filter(r => r.carId === carId);
  }

  function getAllRaceHistory() {
    return state.raceHistory;
  }

  function getStats() { return state.stats; }

  // ── BEATEN ──
  function hasBeaten(mode, index) {
    return !!state.beaten[mode + '_' + index];
  }

  function markBeaten(mode, index) {
    state.beaten[mode + '_' + index] = true;
    save();
  }

  // ── SAVE / LOAD ──
  function save() {
    // Sync active car config back to state
    const car = new Car(state.activeCarId, state.ownedCars[state.activeCarId]);
    state.ownedCars[state.activeCarId] = car.config;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const loaded = JSON.parse(raw);
        // Merge carefully
        state = Object.assign(state, loaded);
        // Ensure metro_s is always owned
        if (!state.ownedCars.metro_s) {
          state.ownedCars.metro_s = defaultCarConfig('metro_s');
        }
      }
    } catch(e) {
      console.warn('Save load failed, starting fresh');
    }
  }

  function resetSave() {
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }

  return {
    getActiveCar, getOwnedCarIds, setActiveCar, buyCar, prevCar, nextCar,
    getOwnedMods, addOwnedMod,
    getCash, addCash, spendCash,
    getLevel, addXP, addCombo, resetCombo,
    recordRace, getRaceHistory, getAllRaceHistory, getStats,
    hasBeaten, markBeaten,
    save, load, resetSave,
  };
})();

// ─── BOOT ───
(function boot() {
  Audio.init();
  Game.load();
  UI.show('title');

  // First-time welcome
  if (Game.getStats().races === 0) {
    setTimeout(() => {
      UI.toast('🏁 Welcome to Nitro Forge! Visit the Dealership to grab your free starter car.', 'info');
    }, 800);
  }

  // Service worker for offline (optional)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

</script>
</body>
</html>
